name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CascadiaUI.slnx -c Release

      - name: Test (also renders the gallery screenshots)
        run: dotnet test CascadiaUI.slnx -c Release --no-build
        env:
          CASCADIA_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/screenshots

      - name: Pack
        run: |
          VERSION_ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARGS="-p:Version=${GITHUB_REF_NAME#v}"
          fi
          dotnet pack src/CascadiaUI/CascadiaUI.csproj -c Release -o artifacts/packages $VERSION_ARGS

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: artifacts/packages

  # Tag v1.2.3 to publish CascadiaUI 1.2.3 to nuget.org with Trusted Publishing
  # (https://www.nuget.org/account/trustedpublishing): the workflow's OIDC token is exchanged for
  # a short-lived API key, so no key is stored. Set the repository variable NUGET_USER to the
  # nuget.org account owning the trusted publishing policy for this workflow; without it, skip.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$NUGET_USER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The NUGET_USER repository variable isn't configured - skip nuget.org"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.config.outputs.enabled == 'true'
        with:
          name: nuget
          path: packages

      - uses: actions/setup-dotnet@v6
        if: steps.config.outputs.enabled == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Log in to nuget.org
        id: login
        if: steps.config.outputs.enabled == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.config.outputs.enabled == 'true'
        env:
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$API_KEY" --skip-duplicate
